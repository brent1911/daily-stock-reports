ly costs you a week.</p>\n  </div>\n\n  <h3>When to kill</h3>\n  <table>\n    <tr><th>Kill</th><th>When</th></tr>\n    <tr><td>An ad</td><td>Spent 2&times; your target cost per conversation with none</td></tr>\n    <tr><td>An ad set</td><td>Spent 3&times; your target cost per booked call with none</td></tr>\n    <tr><td>The whole test</td><td>$600 spent, no booked call, and Sections 5, 9 and 13 all verified</td></tr>\n  </table>\n  <div class=\"box\">\n    <div class=\"lbl\">The honest read at $600</div>\n    <p>Six hundred dollars with tracking verified, DMs answered inside five minutes and the reminder system live, and still no booked call, is not an ads problem. It is an offer problem.</p>\n    <p>Go back to Section 2. Either your ceiling was never high enough, or what you are selling isn't what this audience wants to buy. More budget will not fix either, and will cost you another $600 to confirm.</p>\n  </div>\n\n  <h3>The creative calendar</h3>\n  <p>Creative volume is what decides whether you can ever scale past a few hundred a day. Build the habit now, at $20.</p>\n  <table>\n    <tr><th>Daily spend</th><th>New creatives per month</th></tr>\n    <tr><td>$20</td><td class=\"n\">4&ndash;6</td></tr>\n    <tr><td>$100</td><td class=\"n\">10&ndash;15</td></tr>\n    <tr><td>$300</td><td class=\"n\">30&ndash;50</td></tr>\n  </table>\n  <p class=\"nb\">Three new hooks on an existing winner counts as three creatives. That is the cheapest and most reliable way to hit these numbers.</p>", "<table>\n    <tr><th>Number</th><th>How to get it</th><th>Aim for</th></tr>\n    <tr><td>Cost per conversation</td><td>Spend &divide; conversations started</td><td>$4&ndash;12</td></tr>\n    <tr><td>Conversation to booked</td><td>Calls booked &divide; conversations</td><td>15&ndash;30%</td></tr>\n    <tr><td>Show rate</td><td>Calls held &divide; calls booked</td><td>70%+</td></tr>\n    <tr><td>Close rate</td><td>Clients &divide; calls held</td><td>25%+</td></tr>\n  </table>\n\n  <h4>If you run Path B as well</h4>\n  <table>\n    <tr><th>Number</th><th>How to get it</th><th>Aim for</th></tr>\n    <tr><td>Cost per landing page click</td><td>Spend &divide; link clicks</td><td>$1.50&ndash;3.00</td></tr>\n    <tr><td>Page to form submit</td><td>Forms &divide; page views</td><td>10&ndash;25%</td></tr>\n    <tr><td>Form to booked</td><td>Bookings &divide; forms</td><td>40&ndash;70%</td></tr>\n    <tr><td>Show rate</td><td>Held &divide; booked</td><td>55%+ &mdash; lower than Path A, by nature</td></tr>\n  </table>\n  <div class=\"rule\"><b>Compare the two paths on cost per call <em>held</em>, never booked.</b> Path A books cheaper and shows up better; Path B costs more per booking and runs without you. Only the held number settles which is actually working.</div>\n\n  <div class=\"formula\">Cost per booked call = Spend &divide; Calls booked</div>\n  <p>That one number, against your ceiling from Section 2, is the entire scoreboard. Under your ceiling, scale. Over it, the four numbers above tell you which stage is broken.</p>\n\n  <h3>Fill this in every week</h3>\n  <table class=\"set\">\n    <tr><td>Week ending</td><td>____________</td></tr>\n    <tr><td>Spend</td><td>$________</td></tr>\n    <tr><td>Conversations started</td><td>________</td></tr>\n    <tr><td>Calls booked</td><td>________</td></tr>\n    <tr><td>Calls held</td><td>________</td></tr>\n    <tr><td>Clients signed</td><td>________</td></tr>\n    <tr><td>Cost per booked call</td><td>$________</td></tr>\n    <tr><td>Your ceiling</td><td>$________</td></tr>\n    <tr><td>Verdict</td><td>Scale / Fix / Stop</td></tr>\n  </table>\n\n  <div class=\"box\">\n    <div class=\"lbl\">Ignore these, genuinely</div>\n    <p><strong>Impressions, reach, CTR, CPC, engagement, video views, follower growth.</strong></p>\n    <p>None of them pay you. They are diagnostic at best \u2014 CTR tells you something about a hook when you already know conversations are expensive \u2014 and the rest of the time they are a way to feel busy while the only number that matters goes unexamined.</p>\n    <p>A campaign with a 4% click-through and no booked calls is a failing campaign.</p>\n  </div>\n\n  <div class=\"rule\"><b>Same day, every week, 15 minutes.</b> Checking daily makes you tamper; checking monthly means you burn three weeks on a broken funnel. Weekly is the rhythm that matches how fast the data actually arrives.</div>", "<h4>Account and policy</h4>\n  <table>\n    <tr><th>Problem</th><th>Fix</th></tr>\n    <tr><td>Ad rejected, health policy</td><td>Remove any reference to the reader's body or weight. Talk about your clients and your work instead (Section 6)</td></tr>\n    <tr><td>Ad account restricted</td><td>Request review once. Don't create a second account &mdash; that compounds it. Meanwhile check 2FA and payment methods</td></tr>\n    <tr><td>Page flagged</td><td>Remove before/after images from recent posts, then request review</td></tr>\n    <tr><td>Payment failed, ads off</td><td>Add the backup card. This is why you added two</td></tr>\n    <tr><td>Can't verify domain</td><td>DNS TXT can take 72 hours. If it won't take, use the HTML file upload method instead</td></tr>\n  </table>\n\n  <h4>Tracking</h4>\n  <table>\n    <tr><th>Problem</th><th>Fix</th></tr>\n    <tr><td>Pixel not firing</td><td>Check it's on every page including the confirmation page. Pixel Helper tells you where it's missing</td></tr>\n    <tr><td>Events show Browser only</td><td>CAPI isn't connected. Turn on the native integration in your booking tool</td></tr>\n    <tr><td>Conversions counted twice</td><td>Add a deduplication event ID, or you have the pixel installed twice</td></tr>\n    <tr><td>Return column shows nothing</td><td>You're sending events without a value. Section 5</td></tr>\n    <tr><td>Events Manager shows nothing at all</td><td>Run the test transaction in a private window. Ad blockers hide your own events from you</td></tr>\n  </table>\n\n  <h4>Delivery</h4>\n  <table>\n    <tr><th>Problem</th><th>Fix</th></tr>\n    <tr><td>Zero spend after 24 hours</td><td>Audience too small or ads still in review. Empty the interests, widen the location</td></tr>\n    <tr><td>Stuck in learning phase</td><td>You're editing too often. 50 conversions a week gets you out &mdash; raise budget or stop touching it</td></tr>\n    <tr><td>CPM doubled</td><td>Check account quality first. If clean, wait 48 hours before reacting</td></tr>\n    <tr><td>Frequency above 3</td><td>Audience exhausted. New creative, or widen the location</td></tr>\n    <tr><td>Spend all on one ad</td><td>Normal. That's the algorithm finding the winner</td></tr>\n  </table>\n\n  <h4>Conversion</h4>\n  <table>\n    <tr><th>Problem</th><th>Fix</th></tr>\n    <tr><td>Conversations start, nobody replies</td><td>Your auto-reply isn't asking a question. Section 9, Step 1</td></tr>\n    <tr><td>Good chats, no bookings</td><td>You're sending a link instead of offering two specific times</td></tr>\n    <tr><td>Bookings, no shows</td><td>Section 13. Start with the 60-second SMS asking for a reply</td></tr>\n    <tr><td>Everyone asks the price immediately</td><td>Your ad promised a price. Promise a conversation instead</td></tr>\n    <tr><td>Shows but nobody buys</td><td>Qualify harder in the DM before you book. Volume of calls isn't the goal</td></tr>\n  </table>\n\n  <div class=\"box\">\n    <div class=\"lbl\">If you're stuck and nothing above fits</div>\n    <p>Work the funnel backwards, not forwards. Start at the last stage that works and look at the one immediately after it.</p>\n    <p>Almost every \"ads don't work for me\" turns out to be one specific stage: no tracking, a slow DM reply, or no show-up system. In that order of likelihood.</p>\n  </div>\n\n  <div class=\"end\">\n    <p><strong>The Booked Call Engine</strong> &mdash; work sections 1, 3, 7 and 9 before you blame the ads. They are where the money is, and they are the four that almost nobody does properly.</p>\n  </div>"], T = ["Build the offer", "Test the offer: your ceiling", "Choose your funnel", "Ad account setup", "Tracking", "Ad scripts", "Creative", "Path A &mdash; building the DM campaign", "Path A &mdash; DM scripts", "Path B &mdash; building the call campaign", "Path B &mdash; the page and the video", "Booking page and calendar", "The show-up system", "Optimization", "The weekly scorecard", "Troubleshooting"], D = ["Eight fill-in parts, assembled into one offer statement", "The arithmetic, and the go/no-go before you spend", "DM or call funnel, on real costs and budgets", "Every setting, field by field", "Five installs, each with the test that proves it", "Six fill-in frameworks and compliance rewrites", "What to film, the specs, the testimonial interview", "Exact launch settings at $20/day", "First reply to booked call, every branch", "Budget floor, optimisation event, retargeting", "Page structure, headline formulas, video script, form", "The settings that quietly lose a third of your calls", "Seven touches, with the copy for each", "Symptom to fix, scale triggers, kill criteria", "Four numbers, and what to ignore", "Twenty things that break, and the fix"], L = ["Before the ceiling, before tracking, before a single ad. Ads amplify an offer &mdash; they never create one. A great offer with mediocre ads makes money; perfect ads pointed at a weak offer just lose it faster.", "You have an offer. Now find out whether it can survive paid traffic &mdash; the most you can afford to pay for one booked call. If you skip this, everything downstream is guesswork.", "Two ways to get a call booked. They cost different amounts, need different budgets, and fail for different reasons. Pick deliberately &mdash; most coaches drift into one by accident and never find out the other suited them better.", "Forty minutes of admin that prevents the two most expensive failures: a restricted account, and an account that never learns.", "Do this before you write a single ad. An account that learns from day one is worth more than a prettier ad, and an account that was never instrumented can never tell you what a call costs.", "Six frameworks. Replace the bracketed parts and you have a running ad. Build at least eight before you launch \u2014 one ad is a guess, eight is a test.", "You need ten assets to launch. Filmed on a phone, in one afternoon.", "One campaign, one ad set, four ads, $20 a day. Small on purpose &mdash; you are buying information before you buy clients.", "From their first message to a booked call. One question at a time, never a wall of text, and no price until you have earned the right to give it.", "Traffic straight to a page, a form, and a calendar. Nobody touches it until the call. Budget higher than Path A, and for a reason you must understand before you launch.", "On Path A a conversation does the qualifying. Here the page and the form have to do it alone. Build it in this order.", "Both paths land here. Most coaches lose a third of their booked calls to settings they have never looked at.", "The cheapest money in the whole funnel. Going from 50% to 75% show rate cuts your cost per <em>held</em> call by a third and costs you nothing in ad spend.", "What to change, when, and &mdash; mostly &mdash; when to leave it alone.", "Four numbers, once a week, same day. Everything else on the dashboard is there to distract you.", "The twenty things that break, and what to do about each."];
var i = 0, body = document.getElementById('body'), menu = document.getElementById('menu');

function key(n){ return 'bce_chk_' + n; }

function render(n, keepScroll){
  i = Math.max(0, Math.min(S.length - 1, n));
  body.innerHTML = '<div class="wrap"><div class="kick">Section ' + String(i+1).padStart(2,'0') +
    '</div><h2 class="sh">' + T[i] + '</h2>' +
    (L[i] ? '<p class="lede">' + L[i] + '</p>' : '') + S[i] + '</div>';
  document.getElementById('ttl').textContent = T[i];
  document.getElementById('num').textContent = String(i+1).padStart(2,'0') + '/16';
  document.getElementById('pos').textContent = 'Section ' + (i+1) + ' of 16';
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').disabled = i === S.length - 1;
  document.getElementById('prog').style.width = ((i+1)/S.length*100) + '%';
  try { localStorage.setItem('bce_at', i); } catch(e){}
  if (!keepScroll) window.scrollTo(0,0);
  wireChecks();
  [].forEach.call(document.querySelectorAll('.mrow'), function(r,x){
    r.classList.toggle('cur', x === i);
  });
}

function wireChecks(){
  [].forEach.call(body.querySelectorAll('.chk li'), function(li, x){
    var k = key(i + '_' + x);
    try { if (localStorage.getItem(k) === '1') li.classList.add('done'); } catch(e){}
    li.addEventListener('click', function(){
      li.classList.toggle('done');
      try { localStorage.setItem(k, li.classList.contains('done') ? '1' : '0'); } catch(e){}
    });
  });
}

// menu
var mw = document.getElementById('mlist');
mw.innerHTML = T.map(function(t,x){
  return '<div class="mrow" data-i="' + x + '"><span class="i">' +
    String(x+1).padStart(2,'0') + '</span><span class="x">' + t +
    '<span class="d">' + D[x] + '</span></span></div>';
}).join('');
mw.addEventListener('click', function(e){
  var r = e.target.closest('.mrow'); if (!r) return;
  menu.classList.remove('on'); render(+r.dataset.i);
});
document.getElementById('burger').onclick = function(){ menu.classList.add('on'); };
document.getElementById('mclose').onclick = function(){ menu.classList.remove('on'); };
document.getElementById('prev').onclick = function(){ render(i-1); };
document.getElementById('next').onclick = function(){ render(i+1); };

document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowLeft') render(i-1);
  if (e.key === 'ArrowRight') render(i+1);
});

// install prompt
var deferred = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); deferred = e;
  document.getElementById('installBtn').style.display = 'block';
});
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}
document.getElementById('installBtn').onclick = function(){
  if (deferred){ deferred.prompt(); deferred = null; return; }
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  document.getElementById('insBody').innerHTML = ios
    ? '<ol><li>Tap the <strong>Share</strong> button at the bottom of Safari</li><li>Scroll down and tap <strong>Add to Home Screen</strong></li><li>Tap <strong>Add</strong></li></ol><p class="nb">It opens like an app after that, and works without signal.</p>'
    : '<ol><li>Open the browser menu <strong>(⋮)</strong></li><li>Tap <strong>Install app</strong> or <strong>Add to Home screen</strong></li><li>Confirm</li></ol><p class="nb">It opens like an app after that, and works without signal.</p>';
  document.getElementById('ins').classList.add('on');
};
document.getElementById('insClose').onclick = function(){
  document.getElementById('ins').classList.remove('on');
};
if (isStandalone()) document.getElementById('installBtn').style.display = 'none';

var at = 0;
try { at = parseInt(localStorage.getItem('bce_at') || '0', 10) || 0; } catch(e){}
render(at);

if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(function(){});
</script>

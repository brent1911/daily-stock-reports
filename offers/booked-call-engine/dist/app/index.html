<style>
:root{--ink:#16181d;--mid:#434a59;--mute:#6b7280;--line:#e4e7ec;--bg:#fff;--bg2:#f6f7f9;
 --bg3:#fffaf4;--acc:#b3400a;--acc2:#0d5c63;--ok:#15803d;
 --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 --serif:"Charter","Bitstream Charter",Georgia,serif;--top:54px;--bot:62px}
@media(prefers-color-scheme:dark){:root{--ink:#eceef2;--mid:#b9bfca;--mute:#8b93a3;--line:#2a2f3a;
 --bg:#101217;--bg2:#171a21;--bg3:#1d1813;--acc:#ff8a4c;--acc2:#5bc8d1;--ok:#4ade80}}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;max-width:100%;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17.5px;
 line-height:1.6;-webkit-font-smoothing:antialiased;
 padding:calc(var(--top) + env(safe-area-inset-top)) 0 calc(var(--bot) + env(safe-area-inset-bottom))}
h1,h2,h3,h4,.ui,button,nav{font-family:var(--sans)}
.wrap{max-width:620px;margin:0 auto;padding:0 20px}

/* chrome */
.bar{position:fixed;left:0;right:0;z-index:40;background:var(--bg);border-color:var(--line)}
#top{top:0;height:calc(var(--top) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
 border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-inline:14px}
#top .t{font-size:14px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .n{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.08em}
#bot{bottom:0;height:calc(var(--bot) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
 border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding-inline:12px}
.ico{width:42px;height:42px;min-width:42px;border-radius:9px;border:1px solid var(--line);
 background:var(--bg2);color:var(--ink);font-size:18px;display:flex;align-items:center;
 justify-content:center;cursor:pointer}
.ico[disabled]{opacity:.35}
#bot .mid{flex:1;text-align:center;font-size:12px;color:var(--mute);font-weight:700}
.prog{position:absolute;top:0;left:0;height:2px;background:var(--acc);transition:width .25s}

/* menu */
#menu{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
 padding:calc(18px + env(safe-area-inset-top)) 0 40px;display:none}
#menu.on{display:block}
#menu h2{font-size:20px;margin:0 0 4px}
.mrow{display:flex;gap:12px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line);
 cursor:pointer;font-family:var(--sans)}
.mrow .i{font-size:12px;font-weight:800;color:var(--acc);min-width:24px}
.mrow .x{font-size:15.5px;font-weight:700}
.mrow.cur .x{color:var(--acc)}
.mrow .d{display:block;font-size:13px;color:var(--mute);font-weight:400;margin-top:2px}

/* content */
h2.sh{font-size:clamp(23px,6vw,29px);line-height:1.15;letter-spacing:-.025em;margin:4px 0 6px;font-weight:800}
.kick{font-family:var(--sans);font-size:11px;letter-spacing:.17em;text-transform:uppercase;
 color:var(--acc);font-weight:700}
.lede{font-size:17.5px;color:var(--mid);margin:10px 0 22px}
h3{font-size:18px;margin:26px 0 8px;font-weight:800;letter-spacing:-.012em}
h4{font-size:12.5px;margin:22px 0 7px;text-transform:uppercase;letter-spacing:.09em;color:var(--acc2);font-weight:800}
p{margin:0 0 14px}
ul,ol{margin:0 0 14px;padding-left:21px}li{margin-bottom:8px}
table{width:100%;border-collapse:collapse;margin:16px 0;font-family:var(--sans);font-size:14px;display:block;overflow-x:auto}
th{text-align:left;background:var(--ink);color:var(--bg);padding:9px 10px;font-size:11px;
 text-transform:uppercase;letter-spacing:.06em;font-weight:800;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.script{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--acc2);
 padding:15px 16px;margin:16px 0;border-radius:0 9px 9px 0}
.script .lbl{font-family:var(--sans);font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;
 color:var(--acc2);font-weight:800;margin-bottom:9px}
.script p{margin:0 0 9px;font-size:16.5px}.script p:last-child{margin:0}
.fill{background:#ffe9d4;border-bottom:1px solid var(--acc);padding:0 3px;border-radius:2px;
 font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;font-weight:700;color:#8a2f06}
@media(prefers-color-scheme:dark){.fill{background:#3a2415;color:#ffb184;border-color:#8a4a24}}
.eg{font-size:15.5px;color:var(--mute);font-style:italic;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.box{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--acc);
 padding:15px 16px;margin:16px 0;border-radius:0 9px 9px 0}
.box .lbl{font-family:var(--sans);font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;
 color:var(--acc);font-weight:800;margin-bottom:8px}
.box p:last-child{margin:0}
.rule{background:var(--bg2);border-left:3px solid var(--acc2);padding:13px 15px;margin:16px 0;
 font-family:var(--sans);font-size:15.5px;border-radius:0 9px 9px 0}
blockquote{border-left:3px solid var(--acc);background:var(--bg3);margin:16px 0;padding:14px 16px;border-radius:0 9px 9px 0}
blockquote p:last-child{margin:0}
.formula{background:var(--ink);color:var(--bg);padding:17px;margin:16px 0;text-align:center;
 font-family:var(--sans);font-size:16px;font-weight:800;border-radius:10px}
.kpi{display:flex;gap:9px;margin:16px 0}
.kpi div{flex:1;background:var(--bg2);border-top:2.5px solid var(--acc2);padding:12px 10px;border-radius:0 0 8px 8px}
.kpi .k{font-family:var(--sans);font-size:19px;font-weight:800}
.kpi .v{font-family:var(--sans);font-size:9.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.07em;margin-top:3px}
.chk{list-style:none;padding:0;font-family:var(--sans);font-size:15.5px}
.chk li{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);margin:0;cursor:pointer}
.chk li::before{content:"";display:inline-block;min-width:21px;height:21px;margin-top:1px;
 border:1.6px solid var(--mid);border-radius:5px}
.chk li.done{color:var(--mute)}
.chk li.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:#fff;
 font-weight:800;text-align:center;line-height:19px;font-size:14px}
.nb{font-size:15.5px;color:var(--mute);font-style:italic}
.end{border-top:2px solid var(--ink);margin-top:26px;padding-top:14px;font-family:var(--sans);font-size:14px;color:var(--mute)}

/* install */
#ins{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:none;
 align-items:flex-end;justify-content:center}
#ins.on{display:flex}
#ins .card{background:var(--bg);width:100%;max-width:520px;border-radius:16px 16px 0 0;
 padding:24px 22px calc(26px + env(safe-area-inset-bottom))}
#ins h3{margin:0 0 10px}
#ins ol{padding-left:19px}
#ins .close{width:100%;margin-top:14px;background:var(--acc);color:#fff;border:0;border-radius:9px;
 padding:15px;font-size:16px;font-weight:700;min-height:52px;cursor:pointer}
.ghost{background:none;border:0;color:var(--mute);font-family:var(--sans);font-size:13px;
 text-decoration:underline;cursor:pointer;padding:0}
</style>
</head>

  <div class="wrap">
    <h2>The Booked Call Engine</h2>

    <div id="mlist"></div>
    <button id="installBtn" style="display:none;width:100%;margin:20px 0 10px;background:var(--acc);
      color:#fff;border:0;border-radius:9px;padding:15px;font-size:16px;font-weight:700;min-height:52px;
      cursor:pointer;font-family:var(--sans)">Add to home screen</button>

  </div>
</div>

  <div class="card">
    <h3>Keep it on your home screen</h3>
    <div id="insBody"></div>
    <button class="close" id="insClose">Got it</button>
  </div>
</div>

<script>
var S = ["<p>Eight parts. Fill each one in, in order, and the end of this section assembles them into a single statement you'll use in every ad, page and call that follows.</p>\n\n  <h3>1. Who, exactly</h3>\n  <p>Narrower than feels comfortable. \"Busy professionals\" is not an avatar &mdash; it's a way of avoiding the choice.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Fill in</div>\n    <p>I work with <span class=\"fill\">[AGE RANGE]</span> <span class=\"fill\">[GENDER, IF IT'S TRUE]</span> who are <span class=\"fill\">[JOB OR LIFE SITUATION]</span> and <span class=\"fill\">[THE CONSTRAINT THEY LIVE WITH]</span>.</p>\n    <div class=\"eg\">I work with 30&ndash;45 year old women who are nurses on rotating shifts and can't train at the same time two days running.</div>\n  </div>\n  <div class=\"box\">\n    <div class=\"lbl\">Why narrow wins on every metric at once</div>\n    <p>A narrow avatar writes your ad copy for you, raises click-through because the reader recognises themselves, raises close rate because you've solved this exact problem before, and lets you charge more because you're a specialist rather than a generalist.</p>\n    <p>The fear is that you shrink your market. In practice you are picking the slice you already convert best, and paid traffic will find you more of them than you could ever reach organically.</p>\n  </div>\n\n  <h3>2. The promise</h3>\n  <p>Outcome, timeframe, and the thing they dread that you remove. All three, or it isn't a promise.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Fill in</div>\n    <p><span class=\"fill\">[OUTCOME THEY'D NOTICE DAY TO DAY]</span> in <span class=\"fill\">[WEEKS]</span> weeks, without <span class=\"fill\">[THE THING THEY DREAD]</span>.</p>\n    <div class=\"eg\">Get through a full shift without the 3pm crash, in 12 weeks, without 5am starts or giving up wine.</div>\n  </div>\n  <div class=\"rule\"><b>Make the outcome felt, not numeric.</b> \"Lose 20lbs\" is a weaker promise than \"get your energy back\" &mdash; it's less emotionally specific, easier to disprove, and it's the phrasing that gets your ads rejected. Pick something they'd notice on a Tuesday.</div>\n  <p class=\"nb\">Be honest about the timeframe. Body composition changes show up around 12&ndash;16 weeks. Promising it in 6 sells the first month and loses the client in the third.</p>\n\n  <h3>3. The mechanism &mdash; the part that sets your price</h3>\n  <p>This is the single biggest lever in the whole section. The mechanism is <em>why yours works when the last three things didn't</em>. Without one you're selling \"coaching\", which is a commodity priced by the hour. With one you're selling a specific method, which is priced by the outcome.</p>\n  <table>\n    <tr><th>Archetype</th><th>The claim</th><th>Fits a coach who&hellip;</th></tr>\n    <tr><td>Sequencing</td><td>We fix <span class=\"fill\">[X]</span> before touching <span class=\"fill\">[Y]</span> &mdash; doing it the other way round is why it failed before</td><td>Has a strong opinion about order</td></tr>\n    <tr><td>Constraint-fit</td><td>Built around <span class=\"fill\">[THEIR REAL CONSTRAINT]</span>, not adapted to it afterwards</td><td>Serves one specific lifestyle</td></tr>\n    <tr><td>Minimum dose</td><td><span class=\"fill\">[N]</span> sessions of <span class=\"fill\">[N]</span> minutes. Everything else was optional</td><td>Works with time-poor clients</td></tr>\n    <tr><td>Adjustment cycle</td><td>We change the plan every <span class=\"fill\">[N]</span> days based on <span class=\"fill\">[WHAT YOU MEASURE]</span></td><td>Is systematic and data-led</td></tr>\n    <tr><td>Root cause</td><td>Most <span class=\"fill\">[WHO]</span> blame <span class=\"fill\">[WRONG CAUSE]</span>. It's actually <span class=\"fill\">[REAL CAUSE]</span></td><td>Has a contrarian, defensible view</td></tr>\n  </table>\n  <div class=\"script\">\n    <div class=\"lbl\">Fill in &mdash; one sentence, no jargon</div>\n    <p>Most <span class=\"fill\">[WHO]</span> think the problem is <span class=\"fill\">[WHAT THEY BLAME]</span>. It's actually <span class=\"fill\">[THE REAL MECHANISM]</span>, which is why <span class=\"fill\">[WHAT THEY KEEP TRYING]</span> makes it worse. So we <span class=\"fill\">[WHAT YOU DO INSTEAD]</span> first.</p>\n    <div class=\"eg\">Most shift workers think the problem is willpower. It's actually that rotating sleep wrecks appetite signalling, which is why eating less makes the next week worse. So we fix sleep anchors and protein floor before we touch calories at all.</div>\n  </div>\n  <div class=\"box\">\n    <div class=\"lbl\">Test it like this</div>\n    <p>Say your mechanism out loud to someone outside fitness. If they can repeat it back, it's a mechanism. If they say \"so&hellip; personal training?\", you don't have one yet &mdash; and no amount of ad spend will fix that.</p>\n    <p>You almost certainly already have one. It's the thing you explain on every sales call and have never written down.</p>\n  </div>\n\n  <h3>4. What they actually get</h3>\n  <p>Five lines maximum, each tied to the mechanism. Deliverables that don't serve the mechanism are padding, and experienced buyers read padding as weakness.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Fill in</div>\n    <p>&bull; <span class=\"fill\">[THE TRAINING: format, frequency, where]</span><br>\n       &bull; <span class=\"fill\">[THE NUTRITION: structure, not a meal plan]</span><br>\n       &bull; <span class=\"fill\">[THE CHECK-IN: how often, what happens in it]</span><br>\n       &bull; <span class=\"fill\">[ACCESS: how they reach you, and the honest response time]</span><br>\n       &bull; <span class=\"fill\">[THE ADJUSTMENT: what changes, and how often]</span></p>\n  </div>\n  <p class=\"nb\">State the access honestly. \"WhatsApp, answered within a day on weekdays\" keeps clients happier than \"24/7 support\" that you resent by week three.</p>\n\n  <h3>5. The structure</h3>\n  <p>How the money is arranged, which turns out to matter more than the number itself. Each structure can absorb a different amount of traffic cost before the economics break:</p>\n  <table>\n    <tr><th>Structure</th><th>Shape</th><th>Client value</th><th>Can afford per booked call</th></tr>\n    <tr><td>Month-to-month</td><td>$150/mo, cancel anytime</td><td class=\"n\">$450</td><td class=\"n\">$32</td></tr>\n    <tr><td>Minimum commitment</td><td>$600/mo &times; 4 months</td><td class=\"n\">$2,400</td><td class=\"n\">$168</td></tr>\n    <tr><td>Recurring renewal</td><td>$2,000 per 6 months</td><td class=\"n\">$3,000</td><td class=\"n\">$210</td></tr>\n    <tr><td>Deposit hybrid</td><td>$2,500 up front + $300 &times; 6</td><td class=\"n\">$4,300</td><td class=\"n\">$301</td></tr>\n    <tr><td>Paid in full</td><td>$6,000 for 2 months, intensive</td><td class=\"n\">$6,000</td><td class=\"n\">$420</td></tr>\n  </table>\n  <div class=\"rule\"><b>Month-to-month cannot run paid ads. At all.</b> It can afford $32 per booked call and nothing you could buy comes close. If that's your current structure, changing it is the highest-value thing in this entire guide &mdash; worth more than any targeting or creative decision you will ever make.</div>\n  <p>Three rules when picking:</p>\n  <ol class=\"tight\">\n    <li><strong>Match the term to the result.</strong> If the promise takes 12&ndash;16 weeks, the commitment is four months. Selling month-to-month on a twelve-week promise guarantees people leave before it works.</li>\n    <li><strong>Take money up front where you honestly can.</strong> Up-front cash funds the ad spend that fills the next slot, and clients who pay more up front show up more.</li>\n    <li><strong>Never discount the payment plan.</strong> Price it <em>above</em> the paid-in-full total. The plan removes a cash objection; it isn't the better deal.</li>\n  </ol>\n\n  <h3>6. The price</h3>\n  <div class=\"script\">\n    <div class=\"lbl\">Fill in</div>\n    <p>Paid in full: <span class=\"fill\">[$____]</span> &nbsp;&middot;&nbsp; Plan: <span class=\"fill\">[$____]</span> &times; <span class=\"fill\">[__]</span> months &nbsp;&middot;&nbsp; Total if plan: <span class=\"fill\">[$____]</span></p>\n    <p>Minimum commitment: <span class=\"fill\">[__]</span> months</p>\n  </div>\n  <p>Two sanity checks before you move on:</p>\n  <ul class=\"tight\">\n    <li><strong>Is this worth 10&times; the price to them?</strong> If someone pays $2,400 to stop crashing at 3pm every shift for the next decade, that's an easy yes. If you can't make that case, the promise is too small &mdash; fix the promise, not the price.</li>\n    <li><strong>Would you pay it?</strong> If you'd hesitate, you'll communicate that hesitation on every call, and prospects read it instantly.</li>\n  </ul>\n\n  <h3>7. The guarantee</h3>\n  <p>A guarantee isn't softness &mdash; it's a lever on close rate, and close rate multiplies straight through to what you can afford to pay for traffic.</p>\n  <div class=\"box\">\n    <div class=\"lbl\">What a guarantee is actually worth</div>\n    <p>Lifting close rate from <strong>30% to 40%</strong> raises every ceiling in the table above by about a third, because it cuts the booked calls needed per signed client from 4.8 to 3.6.</p>\n    <p>That is the same effect as making your traffic a third cheaper &mdash; achieved by changing a sentence on your offer rather than by becoming better at Meta ads.</p>\n  </div>\n  <p>Guarantee the work, never the outcome. You control whether you deliver; you don't control whether they do.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Three that hold up</div>\n    <p><strong>Recoup.</strong> Do <span class=\"fill\">[THE DEFINED WORK]</span> for <span class=\"fill\">[N]</span> weeks and if you haven't <span class=\"fill\">[THE MINIMUM OUTCOME]</span>, I coach you free until you do.</p>\n    <p><strong>Process.</strong> Complete every check-in for <span class=\"fill\">[N]</span> weeks and if you can honestly say you got nothing, full refund.</p>\n    <p><strong>First two weeks.</strong> If it isn't what I described within 14 days, full refund, no argument.</p>\n  </div>\n  <p class=\"nb\">The recoup version is strongest: it costs you time rather than money, it only triggers for people who did the work, and \"I'll keep going until it works\" is the most reassuring sentence a sceptical buyer can hear.</p>\n\n  <h3>8. What it isn't</h3>\n  <p>Two or three lines. Saying this out loud raises conversion among the people who do fit, and it is the cheapest filter you will ever install.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Fill in</div>\n    <p>This isn't for you if you want <span class=\"fill\">[WHAT YOU DON'T DO]</span>, if you're after <span class=\"fill\">[THE SHORTCUT YOU REFUSE]</span>, or if you can't commit <span class=\"fill\">[THE MINIMUM REALISTIC INPUT]</span>.</p>\n  </div>\n\n  <h3>Assemble it</h3>\n  <p>One sentence. This becomes your ad hook, your landing page headline, and the first thing you say on every call.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Your offer statement</div>\n    <p>I help <span class=\"fill\">[WHO]</span> <span class=\"fill\">[OUTCOME]</span> in <span class=\"fill\">[TIMEFRAME]</span> through <span class=\"fill\">[MECHANISM]</span>, without <span class=\"fill\">[WHAT THEY DREAD]</span> &mdash; for <span class=\"fill\">[PRICE]</span> over <span class=\"fill\">[TERM]</span>, guaranteed by <span class=\"fill\">[GUARANTEE]</span>.</p>\n    <div class=\"eg\">I help shift-working nurses get through a full shift without the 3pm crash in 12 weeks, by fixing sleep anchors and protein before touching calories, without 5am starts &mdash; for $600 a month over four months, and if they do the check-ins and nothing changes I keep coaching free until it does.</div>\n  </div>\n\n  <h3>The stress test</h3>\n  <p>Eight questions. Any \"no\" is cheaper to fix now than after $600 of traffic.</p>\n  <ul class=\"chk\">\n    <li>Can you say the whole offer in one sentence, without notes?</li>\n    <li>Does the promise have a timeframe you'd defend?</li>\n    <li>Could a stranger repeat your mechanism back to you?</li>\n    <li>Does every deliverable serve that mechanism?</li>\n    <li>Does the term match how long the result actually takes?</li>\n    <li>Would you pay this price yourself?</li>\n    <li>Can you name who it's <em>not</em> for?</li>\n    <li>Does your structure clear $150 per booked call? (Section 2 proves it)</li>\n  </ul>\n  <div class=\"rule\"><b>Don't move on until the last one is yes.</b> Section 2 is where you test it with your own numbers, and it is the gate on every dollar you spend after this.</div>", "<div class=\"formula\">Ceiling = Show&nbsp;% &times; Close&nbsp;% &times; (Client value &divide; 3)</div>\n\n  <p>The divide-by-three is the rule that keeps you solvent: a client has to be worth at least three times what you pay to acquire them. Anything tighter and one refund or one bad month wipes the account.</p>\n\n  <h3>Fill this in</h3>\n  <table class=\"set\">\n    <tr><td>A &mdash; What one client pays you in total</td><td>$________</td></tr>\n    <tr><td>B &mdash; Of people who book, how many show up</td><td>_____ %</td></tr>\n    <tr><td>C &mdash; Of people who show, how many buy</td><td>_____ %</td></tr>\n    <tr><td>D &mdash; Your ceiling: B &times; C &times; (A &divide; 3)</td><td>$________</td></tr>\n  </table>\n\n  <p class=\"nb\">Don't have B and C? Use 70% and 30%. Those are competent-operator numbers, not best case. If your real numbers come in lower, your ceiling drops with them.</p>\n\n  <p>Those five structures from Section 1 carry very different ceilings &mdash; $32 at month-to-month, $420 paid in full. Run your own numbers above and compare them to the structure you picked.</p>\n\n  <h3>If you need to raise your ceiling</h3>\n  <p>Four levers, in the order they are easiest to move:</p>\n  <ol class=\"tight\">\n    <li><strong>Add an upfront payment.</strong> $1,500 down then monthly beats pure monthly on day-one cash and on retention.</li>\n    <li><strong>Extend the minimum term.</strong> Four months instead of month-to-month. Body composition results take 12&ndash;16 weeks; a one-month offer promises something it can't deliver.</li>\n    <li><strong>Raise the price.</strong> The fastest lever and the one most coaches avoid. A 20% increase moves your ceiling 20%.</li>\n    <li><strong>Fix show rate before close rate.</strong> Easier to move, and Section 13 is entirely about it.</li>\n  </ol>\n  <p class=\"nb\">Don't model retention past 12 months. You can't forecast it honestly, and building a budget on it is how accounts go broke slowly.</p>", "<h3>Path A &mdash; the DM funnel</h3>\n  <p>Ad &rarr; they tap <em>Send message</em> &rarr; you have a conversation &rarr; you offer two times &rarr; call booked.</p>\n  <p>A human qualifies before anyone touches a calendar. Cheap conversations, high volume, and it needs someone answering messages inside five minutes.</p>\n\n  <h3>Path B &mdash; the call funnel</h3>\n  <p>Ad &rarr; landing page &rarr; they watch or read &rarr; application form &rarr; calendar &rarr; call booked.</p>\n  <p>The page and the form do the qualifying. Nobody touches it until the call itself. More expensive per booking, and it runs while you sleep.</p>\n\n  <h3>What each actually costs</h3>\n  <table>\n    <tr><th>&nbsp;</th><th>Path A &mdash; DM</th><th>Path B &mdash; Call funnel</th></tr>\n    <tr><td>Cost per conversation / page click</td><td class=\"n\">$4&ndash;12</td><td class=\"n\">$1.50&ndash;3.00</td></tr>\n    <tr><td>Converts to booking at</td><td class=\"n\">15&ndash;30%</td><td class=\"n\">4&ndash;10% of clicks</td></tr>\n    <tr><td><strong>Cost per booked call</strong></td><td class=\"n\"><strong>$30&ndash;80</strong></td><td class=\"n\"><strong>$60&ndash;200</strong></td></tr>\n    <tr><td>Show rate</td><td class=\"n\">70&ndash;80%</td><td class=\"n\">45&ndash;65%</td></tr>\n    <tr><td><strong>Cost per call actually held</strong></td><td class=\"n\"><strong>$40&ndash;115</strong></td><td class=\"n\"><strong>$110&ndash;350</strong></td></tr>\n    <tr><td>Minimum daily budget</td><td class=\"n\">$20</td><td class=\"n\">$70&ndash;100</td></tr>\n    <tr><td>Your time per booking</td><td class=\"n\">10&ndash;20 min</td><td class=\"n\">0 min</td></tr>\n  </table>\n\n  <div class=\"box\">\n    <div class=\"lbl\">The show-rate gap is the thing nobody tells you</div>\n    <p>Path A shows up better &mdash; often 20 points better &mdash; for one reason: <strong>they already spoke to a person.</strong> A booking made after a real conversation is an appointment with someone you've met. A booking made from a form is a line in a calendar.</p>\n    <p>So compare the paths on <em>cost per call held</em>, never on cost per call booked. On the booked number Path A looks twice as good; on the held number it often looks three times as good.</p>\n  </div>\n\n  <h3>When each one wins</h3>\n  <table>\n    <tr><th>Choose Path A &mdash; DM, if&hellip;</th><th>Choose Path B &mdash; call funnel, if&hellip;</th></tr>\n    <tr><td>You're starting, or budget is under $50/day</td><td>You have $70&ndash;100/day minimum to spend</td></tr>\n    <tr><td>You can reply within 5 minutes most of the day</td><td>You can't, or won't, be on your phone</td></tr>\n    <tr><td>You don't yet know the common objections</td><td>You already know them cold</td></tr>\n    <tr><td>Your offer needs explaining</td><td>Your offer is proven and easy to state</td></tr>\n    <tr><td>You're local or niche, small audience</td><td>You're online, large audience</td></tr>\n    <tr><td>You have a setter, or you are the setter</td><td>You want it running without anyone</td></tr>\n  </table>\n\n  <div class=\"rule\"><b>If you're under $50/day, this isn't a choice.</b> Run Path A. The call funnel needs volume to work at all, for the reason below.</div>\n\n  <h3>Why the call funnel needs more budget</h3>\n  <p>Meta optimises properly once an ad set gets roughly <strong>50 conversion events a week</strong>. Below that it never leaves the learning phase and delivery stays erratic and expensive.</p>\n  <table>\n    <tr><th>Path</th><th>Event being optimised</th><th>Typical cost</th><th>Spend needed for 50/week</th></tr>\n    <tr><td>A &mdash; DM</td><td>Conversation started</td><td class=\"n\">$4&ndash;12</td><td class=\"n\">$30&ndash;85/day</td></tr>\n    <tr><td>B &mdash; optimise for form submit</td><td>Lead</td><td class=\"n\">$15&ndash;40</td><td class=\"n\">$105&ndash;285/day</td></tr>\n    <tr><td>B &mdash; optimise for booking</td><td>Schedule</td><td class=\"n\">$60&ndash;200</td><td class=\"n\">$430+/day</td></tr>\n  </table>\n  <p>At $20/day a DM campaign gets 12&ndash;35 conversations a week &mdash; not ideal, but enough to move. A call funnel optimising for bookings gets two or three. It will never learn.</p>\n  <div class=\"rule\"><b>So if you run Path B under $150/day, optimise for the form submit (Lead), not the booking (Schedule).</b> You trade some lead quality for an algorithm that actually works. Switch to Schedule once you're past 50 bookings a week.</div>\n\n  <h3>The sequence that works best</h3>\n  <p>If you have the time, don't choose &mdash; sequence. Run Path A first and let it build Path B for you:</p>\n  <ol class=\"tight\">\n    <li><strong>Weeks 1&ndash;4: Path A only.</strong> $20/day. Cheap conversations, and every one teaches you something.</li>\n    <li><strong>Keep a note of the objections.</strong> Every \"how much is it\", every \"I don't have time\", every reason someone went quiet. This is free market research most coaches throw away.</li>\n    <li><strong>Weeks 5&ndash;6: write the landing page from those notes.</strong> Your DM transcripts are the copy. The objection you answered nineteen times is your headline.</li>\n    <li><strong>Week 7+: launch Path B alongside.</strong> Don't turn Path A off &mdash; run both and compare cost per call <em>held</em>.</li>\n  </ol>\n  <div class=\"box\">\n    <div class=\"lbl\">Why this order beats starting with a landing page</div>\n    <p>A landing page written before you've had a hundred DM conversations is a guess about what your market objects to. A landing page written after them is a transcript.</p>\n    <p>Coaches who start with Path B usually spend $1,500 learning what forty DM conversations would have told them for $300.</p>\n  </div>\n\n  <h3>Running both at once</h3>\n  <p>Once both work, the standard structure is:</p>\n  <ul class=\"tight\">\n    <li><strong>Cold traffic &rarr; Path A.</strong> Cheaper to learn on, and the conversation handles scepticism a page can't.</li>\n    <li><strong>Warm and retargeting &rarr; Path B.</strong> Anyone who engaged, watched 50% of a video, or hit the page and didn't book. They already know you, so the page converts far better than it does cold.</li>\n    <li><strong>Separate campaigns, separate budgets.</strong> Never the same campaign. You cannot read the numbers if they're mixed.</li>\n  </ul>\n  <p class=\"nb\">Which sections apply to you: Path A runs on Section 8 and Section 9. Path B runs on Section 10 and Section 11. Everything from Section 12 onward &mdash; the calendar, the show-up system, optimization, the scorecard &mdash; applies to both.</p>", "<h3>Business Manager</h3>\n  <table class=\"set\">\n    <tr><td>Business portfolio</td><td>One, under your own name or business</td></tr>\n    <tr><td>Two-factor auth</td><td>Required on every admin account</td></tr>\n    <tr><td>Admins</td><td>Two people minimum</td></tr>\n    <tr><td>Ad account name</td><td>Business name &mdash; Acquisition</td></tr>\n    <tr><td>Time zone</td><td>Your own. Cannot change later</td></tr>\n    <tr><td>Currency</td><td>Your own. Cannot change later</td></tr>\n    <tr><td>Payment methods</td><td>Two. A declined card pauses everything</td></tr>\n    <tr><td>Spending limit</td><td>Leave unset</td></tr>\n  </table>\n\n  <div class=\"box\">\n    <div class=\"lbl\">Do this before anything else</div>\n    <p>Turn on two-factor authentication and add a second admin and a backup card. A locked account with one admin and one declined card is the single most common way a coach loses a working funnel for three weeks.</p>\n  </div>\n\n  <h3>Assets to connect</h3>\n  <table class=\"set\">\n    <tr><td>Facebook page</td><td>Published, profile photo, 3+ posts</td></tr>\n    <tr><td>Instagram account</td><td>Connected in Business settings</td></tr>\n    <tr><td>Domain</td><td>Verified via DNS TXT record</td></tr>\n    <tr><td>Pixel / dataset</td><td>One, named after the business</td></tr>\n    <tr><td>Attribution setting</td><td>7-day click, 1-day view</td></tr>\n  </table>\n  <p>Verify your domain even if you think you don't need to. Without it you cannot prioritise your own conversion events, and iOS traffic reports badly.</p>\n\n  <h3>A page that doesn't get you rejected</h3>\n  <ul class=\"tight\">\n    <li>Real profile and cover photo, not a logo on white</li>\n    <li>At least three posts, none of them ads</li>\n    <li>Contact details and a website link filled in</li>\n    <li>No before/after body images in the page's recent posts &mdash; they trip health policy review</li>\n  </ul>\n\n  <div class=\"rule\"><b>Policy rule:</b> never use before/after body photos, never imply weight-loss amounts, never address someone's body directly. \"Lose 30lbs\" and \"tired of being overweight?\" both get rejected. Section 6 writes around this.</div>\n\n  <ul class=\"chk\">\n    <li>Two-factor on, second admin added</li>\n    <li>Two payment methods on file</li>\n    <li>Domain verified by DNS</li>\n    <li>Page and Instagram connected</li>\n    <li>Attribution set to 7-day click</li>\n  </ul>", "<p>Five things, in this order. Each has a test. Don't move on until the test passes.</p>\n\n  <table>\n    <tr><th>#</th><th>Install</th><th>The test that proves it</th></tr>\n    <tr><td class=\"n\">1</td><td>Pixel on every page</td><td>Meta Pixel Helper shows it firing on your offer page</td></tr>\n    <tr><td class=\"n\">2</td><td>Domain verified</td><td>Green tick in Business settings &rarr; Brand safety</td></tr>\n    <tr><td class=\"n\">3</td><td>Lead or Schedule event on booking confirmation</td><td>Book a test call yourself. Event appears in Events Manager within 20 minutes</td></tr>\n    <tr><td class=\"n\">4</td><td>Conversions API</td><td>Event shows <em>Server</em> as well as <em>Browser</em> in Events Manager</td></tr>\n    <tr><td class=\"n\">5</td><td>Event prioritised</td><td>Your booking event sits at position 1 in Aggregated Event Measurement</td></tr>\n  </table>\n\n  <div class=\"box\">\n    <div class=\"lbl\">Why the Conversions API is not optional</div>\n    <p>Browser-only tracking loses a meaningful share of conversions to ad blockers, privacy settings and iOS. Those conversions still happen \u2014 Meta just never learns from them, so it keeps optimising on partial data.</p>\n    <p>Most booking tools (GoHighLevel, Calendly, Hubspot) have a native Meta CAPI integration. Turn it on. It is a settings toggle, not a development project.</p>\n  </div>\n\n  <h3>Attach a value to the booking</h3>\n  <p>Send your booking event with a value, not bare. Use <strong>client value &times; show&nbsp;% &times; close&nbsp;%</strong> \u2014 the expected revenue of one booked call.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Worked example</div>\n    <p>$2,400 client value &times; 0.70 show &times; 0.30 close = <strong>$504</strong> per booked call.</p>\n    <p>Send <span class=\"fill\">value: 504</span> and <span class=\"fill\">currency: USD</span> with every Schedule event.</p>\n  </div>\n  <p>This is what lets Meta report a return figure at all, and it is why most coaches' accounts show nothing in that column. It takes two minutes and almost nobody does it.</p>\n\n  <h3>The test transaction</h3>\n  <ol class=\"tight\">\n    <li>Open your offer page in a private window</li>\n    <li>Book a call using a real email and phone</li>\n    <li>Open Events Manager &rarr; Test events</li>\n    <li>Confirm the event lands, carries a value, and shows both Browser and Server</li>\n    <li>Cancel the test booking</li>\n  </ol>\n  <div class=\"rule\"><b>Do not skip this.</b> Watching one event land end to end is the only proof that any of the above actually works. Assuming it works is how coaches spend $2,000 before discovering nothing was recorded.</div>", "<div class=\"rule\"><b>Before you write:</b> the first two seconds carry everything. Never open with \"Hey guys\" or your own name. Open with the reader's situation.</div>\n\n  <h3>1. The specific result</h3>\n  <p>Your strongest ad, every time. Works because it is a claim about a named person, not about the reader's body.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Script</div>\n    <p><span class=\"fill\">[FIRST NAME]</span> is a <span class=\"fill\">[AGE]</span>-year-old <span class=\"fill\">[JOB]</span> with <span class=\"fill\">[CONSTRAINT \u2014 two kids, 60-hour weeks, shift work]</span>.</p>\n    <p>Twelve weeks ago she couldn't <span class=\"fill\">[SPECIFIC THING SHE COULDN'T DO]</span>.</p>\n    <p>Last week she <span class=\"fill\">[SPECIFIC THING SHE DID]</span>.</p>\n    <p>She trains <span class=\"fill\">[NUMBER]</span> times a week for <span class=\"fill\">[MINUTES]</span> minutes. No <span class=\"fill\">[THING THEY FEAR \u2014 meal prep Sundays, 5am starts, giving up wine]</span>.</p>\n    <p>I coach <span class=\"fill\">[WHO YOU WORK WITH]</span> in <span class=\"fill\">[CITY / ONLINE]</span>. If you want the same, send me the word <span class=\"fill\">[KEYWORD]</span> and I'll show you what her plan looked like.</p>\n    <div class=\"eg\">Sarah is a 41-year-old nurse with two kids and rotating night shifts. Twelve weeks ago she couldn't get through a shift without three coffees and a crash at 3pm. Last week she ran her first 5k. She trains three times a week for 40 minutes. No 5am starts, no giving up wine. Send me the word ENERGY and I'll show you her plan.</div>\n  </div>\n\n  <h3>2. Problem, agitate, solve</h3>\n  <div class=\"script\">\n    <div class=\"lbl\">Script</div>\n    <p>You're <span class=\"fill\">[DOING THE RIGHT THING]</span> and still <span class=\"fill\">[NOT GETTING THE RESULT]</span>.</p>\n    <p>So you try harder. <span class=\"fill\">[THING THEY ESCALATE TO]</span>. Then <span class=\"fill\">[NEXT THING]</span>. Three weeks later you're <span class=\"fill\">[WHERE THEY END UP]</span> and quietly wondering if it's just you.</p>\n    <p>It isn't. It's that <span class=\"fill\">[THE ACTUAL MECHANISM THEY'RE MISSING]</span>.</p>\n    <p>I've walked <span class=\"fill\">[NUMBER]</span> <span class=\"fill\">[WHO]</span> through fixing exactly that. Send <span class=\"fill\">[KEYWORD]</span> and I'll tell you where to start.</p>\n    <div class=\"eg\">You're in the gym five days a week and the scale hasn't moved since February. So you add cardio. Then you cut carbs. Three weeks later you're exhausted, eating 1,200 calories, and quietly wondering if it's just you. It isn't. It's that you've been under-eating protein badly enough that you're losing muscle, not fat.</div>\n  </div>\n\n  <h3>3. Myth bust</h3>\n  <div class=\"script\">\n    <div class=\"lbl\">Script</div>\n    <p><span class=\"fill\">[COMMON ADVICE]</span> is why <span class=\"fill\">[WHO]</span> stay stuck.</p>\n    <p>Here's what actually happens: <span class=\"fill\">[THE MECHANISM, IN ONE SENTENCE]</span>.</p>\n    <p>What works instead is <span class=\"fill\">[YOUR APPROACH, IN ONE SENTENCE]</span> \u2014 and it takes <span class=\"fill\">[LESS TIME / LESS RESTRICTION]</span> than what you're doing now.</p>\n    <p>Send <span class=\"fill\">[KEYWORD]</span> if you want the detail.</p>\n    <div class=\"eg\">\"Eat less, move more\" is why busy professionals stay stuck. Here's what actually happens: you cut 800 calories, your body cuts your daily movement by about the same, and you stall at a lower intake than you started with. What works instead is eating more while training in a way that makes your body want to keep the muscle.</div>\n  </div>\n\n  <h3>4. The callout</h3>\n  <p>Cheap conversations, loose qualification. Good for volume, pair it with tight DM screening.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Script</div>\n    <p>This is for you if:</p>\n    <p>&bull; You're <span class=\"fill\">[SITUATION ONE]</span><br>\n       &bull; You've tried <span class=\"fill\">[FAILED APPROACH]</span> and it didn't hold<br>\n       &bull; You have <span class=\"fill\">[REALISTIC TIME]</span> a week, not <span class=\"fill\">[UNREALISTIC TIME]</span><br>\n       &bull; You want <span class=\"fill\">[OUTCOME]</span> without <span class=\"fill\">[THE THING THEY WON'T DO]</span></p>\n    <p>If that's three out of four, send me <span class=\"fill\">[KEYWORD]</span>.</p>\n    <p class=\"nb\">It isn't for you if you're after <span class=\"fill\">[WHAT YOU DON'T DO]</span>.</p>\n  </div>\n\n  <h3>5. The objection pre-handle</h3>\n  <p>Run this as your second ad to anyone who engaged and didn't convert.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Script</div>\n    <p>\"<span class=\"fill\">[THEIR EXACT OBJECTION, IN THEIR WORDS]</span>\"</p>\n    <p>I hear it most weeks. It's fair, and here's the honest answer: <span class=\"fill\">[THE ANSWER, WITHOUT SELLING]</span>.</p>\n    <p><span class=\"fill\">[CLIENT NAME]</span> said the same thing before starting. <span class=\"fill\">[WHAT HAPPENED]</span>.</p>\n    <p>Still unsure? Send <span class=\"fill\">[KEYWORD]</span> and ask me directly. I'll tell you if it's not a fit.</p>\n    <div class=\"eg\">\"I don't have time to meal prep.\" I hear it most weeks. It's fair, and here's the honest answer: none of my clients meal prep. We build your plan around what you already eat. Marcus said the same thing before starting \u2014 he eats out four nights a week and he's down two trouser sizes.</div>\n  </div>\n\n  <h3>6. Direct offer</h3>\n  <p>Your best performer with warm audiences and retargeting. Weakest cold.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Script</div>\n    <p>I'm taking on <span class=\"fill\">[NUMBER]</span> new <span class=\"fill\">[WHO]</span> this month.</p>\n    <p>You get <span class=\"fill\">[DELIVERABLE ONE]</span>, <span class=\"fill\">[DELIVERABLE TWO]</span>, and <span class=\"fill\">[DELIVERABLE THREE]</span>.</p>\n    <p>It's for people who <span class=\"fill\">[QUALIFIER]</span>. It's not for people who <span class=\"fill\">[DISQUALIFIER]</span>.</p>\n    <p>Send <span class=\"fill\">[KEYWORD]</span> and I'll send you the details and what it costs.</p>\n  </div>\n\n  <div class=\"box\">\n    <div class=\"lbl\">Compliance rewrites that still convert</div>\n    <table style=\"margin:2mm 0 0;\">\n      <tr><th>Gets rejected</th><th>Write this instead</th></tr>\n      <tr><td>Lose 30lbs in 12 weeks</td><td>What 12 weeks looked like for Sarah</td></tr>\n      <tr><td>Tired of being overweight?</td><td>Tired of starting over every January?</td></tr>\n      <tr><td>Before and after photo</td><td>Client on camera saying what changed</td></tr>\n      <tr><td>Transform your body</td><td>Train in a way that holds up around a real job</td></tr>\n      <tr><td>Are you struggling with your weight?</td><td>Most plans assume you have two spare hours a day</td></tr>\n    </table>\n    <p style=\"margin-top:2.5mm;\">The pattern: talk about <em>your work and your clients</em>, never about the reader's body. Meta's health policy objects to implied personal attributes, not to fitness.</p>\n  </div>", "<h3>Specs</h3>\n  <table class=\"set\">\n    <tr><td>Aspect ratio</td><td>9:16 vertical</td></tr>\n    <tr><td>Resolution</td><td>1080 &times; 1920</td></tr>\n    <tr><td>Length</td><td>15&ndash;45 seconds</td></tr>\n    <tr><td>Captions</td><td>Burned in, always</td></tr>\n    <tr><td>Hook</td><td>First words out, no intro</td></tr>\n    <tr><td>Audio</td><td>Phone mic is fine indoors, close up</td></tr>\n    <tr><td>Framing</td><td>Eyes at upper third, head not centred</td></tr>\n  </table>\n  <div class=\"rule\"><b>Burn the captions in.</b> Most of your audience watches on mute. An uncaptioned ad is an ad nobody hears.</div>\n\n  <h3>The shot list</h3>\n  <table>\n    <tr><th>Asset</th><th>Count</th><th>What it is</th></tr>\n    <tr><td>Client testimonial</td><td class=\"n\">2</td><td>A real client on camera, interviewed</td></tr>\n    <tr><td>Talking head</td><td class=\"n\">3</td><td>You, straight to camera, one script each</td></tr>\n    <tr><td>Hook variants</td><td class=\"n\">3</td><td>Same talking head, three different openings</td></tr>\n    <tr><td>Static with text</td><td class=\"n\">2</td><td>One claim on a plain background</td></tr>\n  </table>\n  <p class=\"nb\">Three hook variants on one body is the cheapest test you will ever run. The hook does most of the work.</p>\n\n  <h3>The testimonial interview</h3>\n  <p>Ask these seven, in order. Don't script their answers; the unpolished version converts better. Twenty minutes per client, cut to 45 seconds.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Ask exactly this</div>\n    <p>1. What was going on for you before we started?</p>\n    <p>2. What had you already tried?</p>\n    <p>3. What made you finally reach out?</p>\n    <p>4. What were you worried about before you said yes?</p>\n    <p>5. What's different now \u2014 something specific, not a number?</p>\n    <p>6. What surprised you?</p>\n    <p>7. What would you say to someone sitting where you were?</p>\n  </div>\n  <div class=\"box\">\n    <div class=\"lbl\">The two that matter</div>\n    <p>Questions 4 and 5. Question 4 gives you your objection-handling ad in the client's own words. Question 5 gives you the specific, non-numeric result that passes policy review \u2014 \"I can get through a shift without crashing\" rather than \"I lost 18lbs.\"</p>\n    <p>Lead the cut with their answer to 4 or 5. Never with \"I was so sceptical but...\"</p>\n  </div>\n\n  <h3>Three talking-head hooks to film</h3>\n  <div class=\"script\">\n    <div class=\"lbl\">Film all three, same outfit, same spot</div>\n    <p><strong>A.</strong> \"If you're <span class=\"fill\">[DOING THE RIGHT THING]</span> and nothing's moving, it's almost always one of three things.\"</p>\n    <p><strong>B.</strong> \"<span class=\"fill\">[CLIENT NAME]</span> trains three times a week for forty minutes. Here's what we changed.\"</p>\n    <p><strong>C.</strong> \"The advice to <span class=\"fill\">[COMMON ADVICE]</span> is why <span class=\"fill\">[WHO]</span> stay stuck. Here's what actually happens.\"</p>\n  </div>\n  <p class=\"nb\">Rough beats polished. An ad that looks like a post outperforms an ad that looks like an ad, and version one filmed today beats version two filmed never.</p>", "<h3>Campaign level</h3>\n  <table class=\"set\">\n    <tr><td>Objective</td><td>Engagement</td></tr>\n    <tr><td>Conversion location</td><td>Messaging apps</td></tr>\n    <tr><td>Campaign budget optimisation</td><td>Off</td></tr>\n    <tr><td>Special ad category</td><td>None</td></tr>\n    <tr><td>A/B test</td><td>Off</td></tr>\n    <tr><td>Campaign name</td><td>Cold &mdash; DM &mdash; <span class=\"fill\">[MONTH]</span></td></tr>\n  </table>\n\n  <h3>Ad set level</h3>\n  <table class=\"set\">\n    <tr><td>Daily budget</td><td>$20.00</td></tr>\n    <tr><td>Optimisation event</td><td>Conversations</td></tr>\n    <tr><td>Messaging apps</td><td>Messenger + Instagram Direct</td></tr>\n    <tr><td>Schedule</td><td>Run continuously</td></tr>\n    <tr><td>Location</td><td><span class=\"fill\">[CITY + 25mi]</span> or whole country if online</td></tr>\n    <tr><td>Age</td><td><span class=\"fill\">[YOUR RANGE, e.g. 28-55]</span></td></tr>\n    <tr><td>Gender</td><td>Your client base, honestly</td></tr>\n    <tr><td>Detailed targeting</td><td>Empty</td></tr>\n    <tr><td>Advantage detailed targeting</td><td>On</td></tr>\n    <tr><td>Advantage+ placements</td><td>On</td></tr>\n    <tr><td>Audience size shown</td><td>500,000 &ndash; 3,000,000</td></tr>\n  </table>\n\n  <div class=\"box\">\n    <div class=\"lbl\">Leave the interests empty</div>\n    <p>Hand-picked interests were how this worked in 2018. Meta's targeting now reads your creative and finds the audience faster than you can describe it, and interest stacks mostly shrink your pool and raise your costs.</p>\n    <p>Your creative is your targeting. An ad that opens \"if you're a nurse on rotating shifts\" finds nurses on rotating shifts.</p>\n  </div>\n\n  <h3>Ad level</h3>\n  <table class=\"set\">\n    <tr><td>Number of ads</td><td>4, all in the one ad set</td></tr>\n    <tr><td>Format</td><td>Single image or video</td></tr>\n    <tr><td>Primary text</td><td>One script from Section 6</td></tr>\n    <tr><td>Call to action</td><td>Send message</td></tr>\n    <tr><td>Message template</td><td>Custom &mdash; see Section 9</td></tr>\n    <tr><td>Advantage+ creative</td><td>Off while testing</td></tr>\n  </table>\n  <p>Four ads, four different scripts, same ad set. Meta will push spend to the winner within a few days. Turning Advantage+ creative off while testing matters &mdash; you want to know which <em>script</em> won, not which auto-crop won.</p>\n\n  <h3>The keyword trick</h3>\n  <p>End every Path A ad with a single word to send &mdash; ENERGY, PLAN, COACH, whatever fits the ad. Three reasons it matters:</p>\n  <ul class=\"tight\">\n    <li>It gives a hesitant person something trivially easy to do</li>\n    <li>It tells you which ad produced the conversation, without any tracking setup</li>\n    <li>It triggers the right auto-reply if you run more than one offer</li>\n  </ul>\n  <p class=\"nb\">Use a different keyword per ad and your inbox becomes your attribution report.</p>\n\n  <h3>The one audience to add in week two</h3>\n  <p>Upload your existing client list as a Custom Audience, then build a 1% Lookalike from it. Your buyers are the only first-party signal you own, and a lookalike off thirty real clients beats any interest stack you could assemble.</p>\n\n  <ul class=\"chk\">\n    <li>Tracking verified (Section 5) before launch</li>\n    <li>Four ads live in one ad set, one keyword each</li>\n    <li>Detailed targeting left empty</li>\n    <li>$20/day, running continuously</li>\n    <li>Auto-reply live and tested (Section 9)</li>\n    <li>Calendar open and tested (Section 12)</li>\n    <li>Reminder sequence armed (Section 13)</li>\n  </ul>\n\n  <div class=\"rule\"><b>Then leave it alone for 72 hours.</b> Every edit restarts the learning phase and throws away what the account just learned. The urge to fix it on day one is the single most expensive instinct in paid media.</div>", "<div class=\"rule\"><b>The rule that beats every script:</b> reply within five minutes. Conversion roughly halves after the first hour. If you cannot answer inside five minutes during your stated hours, you need an auto-reply holding the slot.</div>\n\n  <h3>Step 1 &mdash; The auto-reply</h3>\n  <p>Fires the second they send your keyword. Buys you time without feeling like a bot.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Send immediately</div>\n    <p>Hey <span class=\"fill\">[FIRST NAME]</span> \u2014 thanks for reaching out \ud83d\udc4b</p>\n    <p>Quick one so I point you at the right thing: what's the main thing you're trying to sort out right now?</p>\n  </div>\n  <p class=\"nb\">One question. Open-ended. No link, no pitch, no \"I'll get back to you.\" You are starting a conversation, not acknowledging a ticket.</p>\n\n  <h3>Step 2 &mdash; Qualify in three questions</h3>\n  <p>One message at a time. Wait for each answer. Three questions, then you decide.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Question one &mdash; the situation</div>\n    <p>Got it. How long's that been going on?</p>\n  </div>\n  <div class=\"script\">\n    <div class=\"lbl\">Question two &mdash; what they've tried</div>\n    <p>And what have you tried so far for it?</p>\n  </div>\n  <div class=\"script\">\n    <div class=\"lbl\">Question three &mdash; the constraint</div>\n    <p>Makes sense. Realistically, how many days a week could you train \u2014 and roughly how long per session?</p>\n  </div>\n  <div class=\"box\">\n    <div class=\"lbl\">What you're listening for</div>\n    <p><strong>Qualified:</strong> a specific problem, a real attempt to fix it, and three or more realistic days a week.</p>\n    <p><strong>Not qualified:</strong> \"just browsing\", no timeline, under two days a week, or looking for a free plan. Be warm and close it out \u2014 see the exit script below.</p>\n  </div>\n\n  <h3>Step 3 &mdash; The transition</h3>\n  <p>The move everyone fumbles. Ask permission, then offer a specific time. Never \"here's my link.\"</p>\n  <div class=\"script\">\n    <div class=\"lbl\">The ask</div>\n    <p>Okay \u2014 based on what you've said I think this is fixable, and it's probably not what you'd expect.</p>\n    <p>Easier to walk you through it than type it. I've got <span class=\"fill\">[DAY]</span> at <span class=\"fill\">[TIME]</span> or <span class=\"fill\">[DAY]</span> at <span class=\"fill\">[TIME]</span> \u2014 20 minutes, no pitch, I'll tell you straight if I'm not the right fit. Which works?</p>\n  </div>\n  <div class=\"rule\"><b>Two specific times, not a link.</b> A calendar link asks them to do work and decide alone. Two times asks them to pick. Send the link only after they choose one.</div>\n\n  <h3>Step 4 &mdash; Lock it in</h3>\n  <div class=\"script\">\n    <div class=\"lbl\">After they pick</div>\n    <p>Perfect. Here's the link to lock it in: <span class=\"fill\">[BOOKING LINK]</span></p>\n    <p>Takes 30 seconds. Use the phone number you actually answer \u2014 I'll call that one.</p>\n  </div>\n\n  <h4>If they book</h4>\n  <div class=\"script\">\n    <div class=\"lbl\">Immediately</div>\n    <p>You're in for <span class=\"fill\">[DAY, TIME]</span> \ud83d\ude4c</p>\n    <p>One thing before we talk: have a think about what you'd want to be different in 90 days. Doesn't need to be a number \u2014 just what you'd notice. That's where we'll start.</p>\n    <p>Anything comes up, message me here. Don't just no-show, I'd rather move it.</p>\n  </div>\n  <p class=\"nb\">That last line is worth real money. It gives permission to reschedule, which converts a silent no-show into a kept appointment on another day.</p>\n\n  <h3>The branches</h3>\n\n  <h4>\"How much is it?\" &mdash; before the call</h4>\n  <div class=\"script\">\n    <div class=\"lbl\">Answer, don't dodge</div>\n    <p>Depends what you need \u2014 it runs between <span class=\"fill\">[LOW]</span> and <span class=\"fill\">[HIGH]</span> depending on how much support you want.</p>\n    <p>I won't quote you properly without knowing your situation, which is what the 20 minutes is for. If it's miles outside your budget I'll say so on the call rather than waste your time.</p>\n  </div>\n  <p class=\"nb\">Refusing to give a range reads as evasive and kills the thread. A range plus a reason keeps it alive.</p>\n\n  <h4>No reply after your first question</h4>\n  <div class=\"script\">\n    <div class=\"lbl\">+4 hours</div>\n    <p>No rush \u2014 still want me to take a look at this?</p>\n  </div>\n  <div class=\"script\">\n    <div class=\"lbl\">+1 day</div>\n    <p>Hey <span class=\"fill\">[FIRST NAME]</span>, didn't want to leave you hanging. Want me to send over what I'd do in your situation, or leave it for now?</p>\n  </div>\n  <div class=\"script\">\n    <div class=\"lbl\">+3 days, then stop</div>\n    <p>All good if the timing's off \u2014 I'll leave it here. If it comes back round, just message me. \ud83d\udc4d</p>\n  </div>\n  <p class=\"nb\">Three follow-ups, then stop. A fourth costs you more in goodwill than it recovers in bookings.</p>\n\n  <h4>\"I need to think about it\"</h4>\n  <div class=\"script\">\n    <div class=\"lbl\">Reply</div>\n    <p>Course. What's the bit you're unsure about \u2014 whether it'd work for you, or the money?</p>\n  </div>\n  <p class=\"nb\">Never argue. Name the two real options and let them tell you which. You cannot handle an objection you haven't identified.</p>\n\n  <h4>Not a fit &mdash; the exit</h4>\n  <div class=\"script\">\n    <div class=\"lbl\">Close it warmly</div>\n    <p>Being straight with you \u2014 at <span class=\"fill\">[THEIR CONSTRAINT]</span> I don't think I'd be able to get you a result worth what I charge, so I'd rather not take your money.</p>\n    <p>What I'd do in your position: <span class=\"fill\">[ONE GENUINELY USEFUL THING]</span>.</p>\n    <p>If things change, message me.</p>\n  </div>\n  <p class=\"nb\">These people refer. Turning someone down well is marketing.</p>\n\n  <div class=\"box\">\n    <div class=\"lbl\">Three things that break DM conversion</div>\n    <p><strong>Walls of text.</strong> One idea per message. If it needs scrolling, it needs splitting.</p>\n    <p><strong>Pitching before qualifying.</strong> Three questions, then the ask. Never the other way round.</p>\n    <p><strong>Leading with the link.</strong> The link goes out after they pick a time, never before.</p>\n  </div>", "<div class=\"rule\"><b>Do not launch this under $70/day.</b> Below that the ad set never exits the learning phase, delivery is erratic, and you will conclude the funnel doesn't work when what didn't work was the budget.</div>\n\n  <h3>Pick your optimisation event first</h3>\n  <p>This single choice decides whether the campaign learns.</p>\n  <table>\n    <tr><th>Your daily budget</th><th>Optimise for</th><th>Why</th></tr>\n    <tr><td>$70&ndash;150</td><td><strong>Lead</strong> (form submit)</td><td>Cheap enough to hit ~50/week. Some lead quality lost, algorithm works</td></tr>\n    <tr><td>$150&ndash;400</td><td><strong>Lead</strong>, then test Schedule</td><td>Run both ad sets, compare cost per call <em>held</em></td></tr>\n    <tr><td>$400+</td><td><strong>Schedule</strong> (booking)</td><td>Enough volume to optimise on the event you actually want</td></tr>\n  </table>\n  <p class=\"nb\">Optimising for a booking you only get three of a week is the most common reason a coach's call funnel \"doesn't work\".</p>\n\n  <h3>Campaign level</h3>\n  <table class=\"set\">\n    <tr><td>Objective</td><td>Leads</td></tr>\n    <tr><td>Conversion location</td><td>Website</td></tr>\n    <tr><td>Campaign budget optimisation</td><td>Off</td></tr>\n    <tr><td>Special ad category</td><td>None</td></tr>\n    <tr><td>Campaign name</td><td>Cold &mdash; Call funnel &mdash; <span class=\"fill\">[MONTH]</span></td></tr>\n  </table>\n\n  <h3>Ad set level</h3>\n  <table class=\"set\">\n    <tr><td>Daily budget</td><td><span class=\"fill\">[$70 MINIMUM]</span></td></tr>\n    <tr><td>Conversion event</td><td>Lead (or Schedule above $400/day)</td></tr>\n    <tr><td>Attribution setting</td><td>7-day click, 1-day view</td></tr>\n    <tr><td>Location</td><td><span class=\"fill\">[YOUR MARKET]</span></td></tr>\n    <tr><td>Age</td><td><span class=\"fill\">[YOUR RANGE]</span></td></tr>\n    <tr><td>Detailed targeting</td><td>Empty</td></tr>\n    <tr><td>Advantage+ placements</td><td>On</td></tr>\n    <tr><td>Dynamic creative</td><td>Off while testing</td></tr>\n  </table>\n\n  <h3>Ad level</h3>\n  <table class=\"set\">\n    <tr><td>Number of ads</td><td>4&ndash;6 in one ad set</td></tr>\n    <tr><td>Destination</td><td>Website &mdash; your landing page URL</td></tr>\n    <tr><td>Call to action</td><td>Book now &nbsp;or&nbsp; Learn more</td></tr>\n    <tr><td>URL parameters</td><td><span class=\"fill\">utm_source=meta&amp;utm_campaign={{campaign.name}}&amp;utm_content={{ad.name}}</span></td></tr>\n  </table>\n  <div class=\"box\">\n    <div class=\"lbl\">Put the UTM parameters in</div>\n    <p>Without them you cannot tell which ad produced a booked call &mdash; only which produced a click. Meta's own reporting under-reports by design, so the booking tool's record is your source of truth, and it only works if the tag arrives with the visitor.</p>\n    <p>Paste that string into the URL parameters field. Meta fills the braces in automatically.</p>\n  </div>\n\n  <h3>The retargeting ad set &mdash; build it on day one</h3>\n  <p>Path B leaks badly: 75&ndash;90% of people who reach your page leave without booking. Retargeting is where the call funnel earns back its higher cost, and almost nobody sets it up until month three.</p>\n  <table>\n    <tr><th>Audience</th><th>Window</th><th>What to show them</th></tr>\n    <tr><td>Visited page, didn't book</td><td>14 days</td><td>The objection-handler ad</td></tr>\n    <tr><td>Watched 50%+ of a video ad</td><td>30 days</td><td>A client testimonial</td></tr>\n    <tr><td>Engaged with page or Instagram</td><td>30 days</td><td>The direct offer</td></tr>\n  </table>\n  <table class=\"set\">\n    <tr><td>Budget</td><td>$10&ndash;20/day, separate ad set</td></tr>\n    <tr><td>Optimisation event</td><td>Schedule &mdash; these people are warm</td></tr>\n    <tr><td>Frequency cap</td><td>Leave Meta to handle it under 30 days</td></tr>\n  </table>\n  <p class=\"nb\">Retargeting bookings routinely cost a third of cold ones. If your blended cost per call looks bad, this is usually the missing piece.</p>\n\n  <ul class=\"chk\">\n    <li>Schedule event verified in Events Manager (Section 5)</li>\n    <li>Landing page live and loads under 3 seconds on mobile</li>\n    <li>Optimisation event matched to budget</li>\n    <li>UTM parameters on every ad</li>\n    <li>Retargeting audiences created</li>\n    <li>Calendar open and tested (Section 12)</li>\n    <li>Reminder sequence armed (Section 13) &mdash; matters more here than on Path A</li>\n  </ul>", "<h3>The page, top to bottom</h3>\n  <ol class=\"tight\">\n    <li><strong>Headline</strong> &mdash; the outcome, for a named kind of person</li>\n    <li><strong>One line of sub-copy</strong> &mdash; what it is and what it isn't</li>\n    <li><strong>The video</strong>, or three short paragraphs if you won't film one</li>\n    <li><strong>Button</strong> &mdash; above the fold, repeated after each section</li>\n    <li><strong>Three proof blocks</strong> &mdash; client, situation, what changed</li>\n    <li><strong>Who it's for / who it's not for</strong> &mdash; two short lists</li>\n    <li><strong>What happens on the call</strong> &mdash; removes the \"is this a sales pitch\" fear</li>\n    <li><strong>The form</strong></li>\n    <li><strong>One line about you</strong> &mdash; last, not first</li>\n  </ol>\n  <div class=\"rule\"><b>One page, one action.</b> No menu, no links out, no \"about\" tab. Every exit is a booking you paid for and lost.</div>\n\n  <h3>Headline formulas</h3>\n  <div class=\"script\">\n    <div class=\"lbl\">Pick one, fill it in</div>\n    <p><strong>1.</strong> How <span class=\"fill\">[WHO]</span> are <span class=\"fill\">[OUTCOME]</span> in <span class=\"fill\">[TIME]</span> &mdash; without <span class=\"fill\">[THE THING THEY DREAD]</span></p>\n    <p><strong>2.</strong> For <span class=\"fill\">[WHO]</span> who are tired of <span class=\"fill\">[THE FAILED PATTERN]</span></p>\n    <p><strong>3.</strong> <span class=\"fill\">[NUMBER]</span> <span class=\"fill\">[WHO]</span> have used this to <span class=\"fill\">[OUTCOME]</span>. Here's how it works.</p>\n    <div class=\"eg\">How shift-working nurses are getting their energy back in 12 weeks &mdash; without 5am starts or giving up wine.</div>\n  </div>\n  <p class=\"nb\">Same compliance rule as the ads: describe your work and your clients, never the reader's body.</p>\n\n  <h3>The video script</h3>\n  <p>Four to six minutes. Filmed on a phone. Seven beats, in this order &mdash; the order is doing most of the work.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Beat 1 &mdash; Callout &middot; 0:00&ndash;0:15</div>\n    <p>If you're <span class=\"fill\">[SITUATION]</span> and <span class=\"fill\">[THE THING THAT ISN'T WORKING]</span>, this is for you. Give me four minutes and I'll show you why it's happening and what to do instead.</p>\n  </div>\n  <div class=\"script\">\n    <div class=\"lbl\">Beat 2 &mdash; Who you are &middot; 0:15&ndash;0:35</div>\n    <p>I'm <span class=\"fill\">[NAME]</span>. I coach <span class=\"fill\">[WHO]</span>. Over the last <span class=\"fill\">[TIME]</span> I've worked with <span class=\"fill\">[NUMBER]</span> of them, and the same thing comes up almost every time.</p>\n  </div>\n  <div class=\"script\">\n    <div class=\"lbl\">Beat 3 &mdash; The real problem &middot; 0:35&ndash;1:35</div>\n    <p>Most <span class=\"fill\">[WHO]</span> think the problem is <span class=\"fill\">[WHAT THEY BLAME]</span>. It isn't.</p>\n    <p>What's actually happening is <span class=\"fill\">[THE MECHANISM, PLAINLY]</span>. Which is why <span class=\"fill\">[THE THING THEY KEEP TRYING]</span> makes it worse, not better.</p>\n  </div>\n  <div class=\"script\">\n    <div class=\"lbl\">Beat 4 &mdash; What works instead &middot; 1:35&ndash;2:35</div>\n    <p>What works is <span class=\"fill\">[YOUR APPROACH IN ONE SENTENCE]</span>.</p>\n    <p>Three parts: <span class=\"fill\">[ONE]</span>, <span class=\"fill\">[TWO]</span>, <span class=\"fill\">[THREE]</span>. That's it. It takes <span class=\"fill\">[REALISTIC TIME]</span> a week.</p>\n  </div>\n  <div class=\"script\">\n    <div class=\"lbl\">Beat 5 &mdash; Proof &middot; 2:35&ndash;3:20</div>\n    <p><span class=\"fill\">[CLIENT]</span> came to me <span class=\"fill\">[THEIR SITUATION]</span>. We did exactly that. <span class=\"fill\">[WHAT CHANGED, SPECIFICALLY]</span>.</p>\n    <p>Same with <span class=\"fill\">[CLIENT TWO]</span> &mdash; <span class=\"fill\">[ONE LINE]</span>.</p>\n  </div>\n  <div class=\"script\">\n    <div class=\"lbl\">Beat 6 &mdash; The call &middot; 3:20&ndash;3:50</div>\n    <p>If you want me to map that out for your situation, book a call below. It's 20 minutes. I'll ask what you've tried, what's in the way, and what you want different in 90 days &mdash; then tell you what I'd do.</p>\n    <p>No presentation, no pressure. If I'm not the right fit I'll say so and point you somewhere better.</p>\n  </div>\n  <div class=\"script\">\n    <div class=\"lbl\">Beat 7 &mdash; Who it isn't for &middot; 3:50&ndash;4:10</div>\n    <p>One thing &mdash; this isn't for everyone. If you're after <span class=\"fill\">[WHAT YOU DON'T DO]</span>, I'm not your person. But if <span class=\"fill\">[THE QUALIFIER]</span>, fill the form in and let's talk.</p>\n  </div>\n  <div class=\"box\">\n    <div class=\"lbl\">Beat 7 is the one people cut, and it's the one that works</div>\n    <p>Disqualifying out loud raises bookings among the people who do qualify, and it raises show rate, because anyone who books has just self-selected against your own stated exclusions.</p>\n    <p>It also makes the call easier. They arrive having already agreed they're the right fit.</p>\n  </div>\n\n  <h3>The form</h3>\n  <p>Seven fields. Every one earns its place by either reaching them or qualifying them.</p>\n  <table>\n    <tr><th>Field</th><th>Type</th><th>Why it's there</th></tr>\n    <tr><td>First name</td><td>Text</td><td>Every message after this uses it</td></tr>\n    <tr><td>Email</td><td>Email</td><td>Confirmation and calendar invite</td></tr>\n    <tr><td>Phone</td><td>Phone, required</td><td>The whole show-up system runs on SMS</td></tr>\n    <tr><td>What are you trying to sort out?</td><td>Short text</td><td>Their words. Opens the call</td></tr>\n    <tr><td>How many days a week can you realistically train?</td><td>1 / 2 / 3 / 4+</td><td>Under 2 is a decline</td></tr>\n    <tr><td>Coaching that fits is likely <span class=\"fill\">[RANGE]</span> a month. Is that workable?</td><td>Yes / Not right now</td><td>The single most valuable field</td></tr>\n    <tr><td>How soon do you want to start?</td><td>Now / 1 month / Just looking</td><td>Sorts your call order</td></tr>\n  </table>\n  <div class=\"box\">\n    <div class=\"lbl\">The budget question is not optional</div>\n    <p>On Path A you find out someone's budget in the DM. On Path B, if you don't ask here, you find out twenty minutes into a call you paid $140 for.</p>\n    <p>Phrase it as a check, not a demand &mdash; \"is that workable?\" &mdash; and put a real range in. It costs you some bookings and every one it costs you was a call you'd have wanted back.</p>\n    <p>Anyone answering \"not right now\" still gets booked, just into your low-priority slots, and goes onto the nurture sequence instead.</p>\n  </div>\n  <div class=\"rule\"><b>Form first, calendar second.</b> Qualify, then show times. A calendar embedded above the form lets unqualified people book straight into your week.</div>\n\n  <h3>The thank-you page</h3>\n  <p>Same job as the Path A confirmation: one instruction, not congratulations.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Thank-you page copy</div>\n    <p><strong>You're booked for <span class=\"fill\">[DAY, TIME]</span>.</strong></p>\n    <p>Check your phone &mdash; I've just sent a text. Reply <strong>Y</strong> so I know you've got it.</p>\n    <p>Before we talk, have a think about one thing: what would you want to be different in 90 days? Not a number &mdash; just what you'd notice day to day.</p>\n  </div>\n  <p class=\"nb\">That reply-Y line matters more here than anywhere else in the product. Path B's show rate is 20 points below Path A's, and this is the cheapest point you can claw any of it back.</p>", "<h3>Calendar settings</h3>\n  <table class=\"set\">\n    <tr><td>Booking window</td><td>Next 3 days only</td></tr>\n    <tr><td>Minimum notice</td><td>2 hours</td></tr>\n    <tr><td>Slot length</td><td>30 minutes</td></tr>\n    <tr><td>Buffer after</td><td>15 minutes</td></tr>\n    <tr><td>Max per day</td><td>4</td></tr>\n    <tr><td>Phone number</td><td>Required field</td></tr>\n    <tr><td>Time zone</td><td>Auto-detect from visitor</td></tr>\n    <tr><td>Reschedule link</td><td>On</td></tr>\n    <tr><td>Cancel link</td><td>Off</td></tr>\n  </table>\n\n  <div class=\"box\">\n    <div class=\"lbl\">Why three days, not three weeks</div>\n    <p>Show rate falls roughly with every day between booking and call. A call booked for next Thursday is a call they have already half forgotten.</p>\n    <p>A short window feels busy, which is also true \u2014 you are only taking four a day.</p>\n  </div>\n\n  <div class=\"rule\"><b>Reschedule on, cancel off.</b> Someone who can't make it will either move it or vanish. Make moving it the easy option and you keep the appointment instead of losing the lead.</div>\n\n  <h3>What the booking page must say</h3>\n  <ul class=\"tight\">\n    <li><strong>What actually happens on the call</strong> \u2014 in one line, plainly</li>\n    <li><strong>How long</strong> \u2014 and keep to it</li>\n    <li><strong>Who you are</strong> \u2014 one photo, one sentence of credibility</li>\n    <li><strong>One testimonial</strong> \u2014 ideally the answer to interview question 4</li>\n    <li><strong>What it is not</strong> \u2014 \"this isn't a hard sell\" if that's true</li>\n  </ul>\n  <div class=\"script\">\n    <div class=\"lbl\">Page copy you can lift</div>\n    <p><strong>A 20-minute call about your situation.</strong></p>\n    <p>I'll ask what you've tried, what's getting in the way, and what you want to be different in 90 days. Then I'll tell you what I'd do \u2014 and whether I'm the right person to do it with you.</p>\n    <p>No presentation, no pressure. If it's not a fit I'll say so and point you somewhere better.</p>\n    <p class=\"nb\">Use the phone number you actually answer. I'll call that one.</p>\n  </div>\n\n  <h3>The confirmation page</h3>\n  <p>Don't waste it on \"thanks, you're booked.\" Give them one job.</p>\n  <div class=\"script\">\n    <div class=\"lbl\">Confirmation page copy</div>\n    <p><strong>You're booked for <span class=\"fill\">[DAY, TIME]</span>.</strong></p>\n    <p>Check your phone \u2014 I've just sent a text. Reply <strong>Y</strong> to it so I know you've got it.</p>\n    <p>Before we talk, have a think about one thing: what would you want to be different in 90 days? Not a number \u2014 just what you'd notice day to day.</p>\n  </div>\n  <p class=\"nb\">That reply-Y instruction is the start of the show-up system, and it is the highest-leverage sentence on the page.</p>", "<div class=\"kpi\">\n    <div><div class=\"k\">50%</div><div class=\"v\">No system</div></div>\n    <div><div class=\"k\">65%</div><div class=\"v\">Reminders only</div></div>\n    <div><div class=\"k\">75&ndash;85%</div><div class=\"v\">Full system below</div></div>\n  </div>\n\n  <h3>Seven touches</h3>\n  <table>\n    <tr><th>When</th><th>Channel</th><th>Job</th></tr>\n    <tr><td>Within 60 seconds</td><td>SMS</td><td>Get a reply out of them</td></tr>\n    <tr><td>Within 5 minutes</td><td>Email</td><td>Calendar file and the detail</td></tr>\n    <tr><td>Same day</td><td>DM</td><td>A human line from you</td></tr>\n    <tr><td>Day before, 6pm</td><td>SMS</td><td>Confirm it's still on</td></tr>\n    <tr><td>1 hour before</td><td>SMS</td><td>Prime them</td></tr>\n    <tr><td>5 minutes before</td><td>SMS</td><td>Remove the last excuse</td></tr>\n    <tr><td>8 minutes after a no-show</td><td>Call, then SMS</td><td>Recover the appointment</td></tr>\n  </table>\n\n  <h3>The copy</h3>\n\n  <div class=\"script\">\n    <div class=\"lbl\">1 &mdash; SMS, within 60 seconds</div>\n    <p>Hey <span class=\"fill\">[FIRST NAME]</span>, it's <span class=\"fill\">[YOUR NAME]</span>. You're booked for <span class=\"fill\">[DAY]</span> at <span class=\"fill\">[TIME]</span> \u2014 I'll call this number.</p>\n    <p>Reply <strong>Y</strong> so I know you've got this \ud83d\udc4d</p>\n  </div>\n  <div class=\"box\">\n    <div class=\"lbl\">Why the reply matters more than the reminder</div>\n    <p>Someone who has typed one character back has made a small commitment to a person. That single reply is the biggest step up in show rate of anything in this section.</p>\n    <p>If they don't reply within two hours, send: <em>\"Just checking this number's right for <span class=\"fill\">[DAY]</span>?\"</em> A non-reply is your earliest warning of a no-show \u2014 chase it now, not on the day.</p>\n  </div>\n\n  <div class=\"script\">\n    <div class=\"lbl\">2 &mdash; Email, within 5 minutes</div>\n    <p><strong>Subject:</strong> Your call &mdash; <span class=\"fill\">[DAY]</span> at <span class=\"fill\">[TIME]</span></p>\n    <p>Hi <span class=\"fill\">[FIRST NAME]</span>,</p>\n    <p>Booked in for <span class=\"fill\">[DAY, DATE]</span> at <span class=\"fill\">[TIME]</span>. Calendar invite attached. I'll call <span class=\"fill\">[THEIR NUMBER]</span>.</p>\n    <p>It's 20 minutes. I'll ask what you've tried, what's in the way, and what you want different in 90 days \u2014 then tell you what I'd do and whether I'm the right fit.</p>\n    <p>One thing to think about: what would you notice day to day if this were sorted? That's where we'll start.</p>\n    <p>Can't make it, use this to move it: <span class=\"fill\">[RESCHEDULE LINK]</span> \u2014 just don't leave me hanging.</p>\n    <p><span class=\"fill\">[YOUR NAME]</span></p>\n  </div>\n\n  <div class=\"script\">\n    <div class=\"lbl\">3 &mdash; DM, same day</div>\n    <p>Just saw you booked for <span class=\"fill\">[DAY]</span> \u2014 nice one. Looking forward to it.</p>\n    <p>Anything you specifically want me to cover, send it over beforehand and I'll come prepared.</p>\n  </div>\n\n  <div class=\"script\">\n    <div class=\"lbl\">4 &mdash; SMS, day before at 6pm</div>\n    <p>Hey <span class=\"fill\">[FIRST NAME]</span> \u2014 still good for <span class=\"fill\">[TIME]</span> tomorrow?</p>\n    <p>If something's come up just say and we'll move it, no problem.</p>\n  </div>\n  <p class=\"nb\">Offering the reschedule is counter-intuitive and it raises net held calls. You trade a handful of moved calls for far fewer silent no-shows.</p>\n\n  <div class=\"script\">\n    <div class=\"lbl\">5 &mdash; SMS, 1 hour before</div>\n    <p>Speaking in an hour <span class=\"fill\">[FIRST NAME]</span>. Have a think on that question \u2014 what would be different in 90 days?</p>\n  </div>\n\n  <div class=\"script\">\n    <div class=\"lbl\">6 &mdash; SMS, 5 minutes before</div>\n    <p>Calling you in 5 \ud83d\udc4d Grab somewhere you can talk for 20.</p>\n  </div>\n\n  <div class=\"script\">\n    <div class=\"lbl\">7 &mdash; No-show recovery</div>\n    <p><strong>At +8 min, call again.</strong> A third of no-shows answer the second call.</p>\n    <p><strong>Then SMS:</strong> Tried you just now \u2014 guessing something came up. Want to grab <span class=\"fill\">[TOMORROW, TIME]</span> instead? <span class=\"fill\">[RESCHEDULE LINK]</span></p>\n    <p><strong>Next day:</strong> Still worth a conversation, <span class=\"fill\">[FIRST NAME]</span>? Happy to work around you \u2014 just send a day that suits.</p>\n    <p><strong>+3 days, last one:</strong> I'll stop chasing \ud83d\ude42 If you want to pick it up, message me any time. Either way, good luck with it.</p>\n  </div>\n\n  <h3>The pre-call question</h3>\n  <p>Notice it appears five times: on the confirmation page, in the email, in the DM, an hour before, and as the opening of the call itself.</p>\n  <p>It does two jobs. It gives them a reason to show that isn't about you, and it means they arrive having already pictured the outcome \u2014 which makes the call shorter and the close easier.</p>\n  <div class=\"rule\"><b>Never ask for homework that takes effort.</b> A form to fill in or a food diary lowers show rate. One question they can answer in the shower raises it.</div>\n\n  <ul class=\"chk\">\n    <li>SMS fires within 60 seconds of booking</li>\n    <li>It asks for a one-character reply</li>\n    <li>Non-repliers chased within 2 hours</li>\n    <li>Day-before SMS offers the reschedule</li>\n    <li>5-minute warning sends</li>\n    <li>Second call at +8 minutes, not just a text</li>\n    <li>Pre-call question appears in all five places</li>\n    <li>Cancel link disabled, reschedule link live</li>\n  </ul>", "<div class=\"rule\"><b>The first rule:</b> change nothing for 72 hours or 50 conversations, whichever comes later. Every edit restarts the learning phase. Most accounts are ruined by their owner on day two.</div>\n\n  <h3>Diagnose by symptom &mdash; Path A, the DM funnel</h3>\n  <table>\n    <tr><th>What you see</th><th>What it means</th><th>What to do</th></tr>\n    <tr><td>Click-through under 1%</td><td>The hook isn't landing</td><td>Three new first lines on the same video</td></tr>\n    <tr><td>Click-through fine, no conversations</td><td>Ad and offer don't match</td><td>Rewrite the ad to match what you actually sell</td></tr>\n    <tr><td>Conversations start, nobody replies</td><td>Auto-reply is doing the wrong job</td><td>Open with a question, not an acknowledgement</td></tr>\n    <tr><td>Conversations don't become calls</td><td>Qualifying or the transition</td><td>Two specific times, never a bare link</td></tr>\n    <tr><td>Calls booked, nobody shows</td><td>No show-up system</td><td>Section 13, all seven touches</td></tr>\n    <tr><td>They show, nobody buys</td><td>Price, or the wrong people</td><td>Tighten qualifying before touching price</td></tr>\n    <tr><td>Cost per conversation climbing</td><td>Creative fatigue</td><td>New creative. Frequency above 2.5 confirms it</td></tr>\n    <tr><td>CPM spiked overnight</td><td>Auction, seasonal, or a policy flag</td><td>Check account quality, then wait 48h</td></tr>\n    <tr><td>Spend won't leave the ad set</td><td>Audience too narrow or budget too low</td><td>Empty the interests, widen the location</td></tr>\n    <tr><td>One ad eating everything</td><td>Working as designed</td><td>Leave it. Build variations of the winner</td></tr>\n  </table>\n\n  <h3>Diagnose by symptom &mdash; Path B, the call funnel</h3>\n  <table>\n    <tr><th>What you see</th><th>What it means</th><th>What to do</th></tr>\n    <tr><td>Clicks fine, nobody fills the form</td><td>Page doesn't match the ad</td><td>The headline must repeat the ad's promise almost word for word</td></tr>\n    <tr><td>Form started, not finished</td><td>Too many fields, or the budget question landed cold</td><td>Seven fields maximum. Put the budget question second to last</td></tr>\n    <tr><td>Forms submitted, no bookings</td><td>Calendar sits behind another click</td><td>Show times on the thank-you page itself, not in an email</td></tr>\n    <tr><td>Bookings but terrible show rate</td><td>Normal for Path B &mdash; and fixable</td><td>Section 13, all seven touches. Expect 45&ndash;65% without it</td></tr>\n    <tr><td>Cost per lead climbing after week 2</td><td>Creative fatigue, faster here than Path A</td><td>New creative. Pages tire audiences quicker than DMs do</td></tr>\n    <tr><td>Stuck in learning phase</td><td>Optimising for an event you get 3 of a week</td><td>Switch to Lead, or raise budget. Section 3</td></tr>\n    <tr><td>Meta reports more bookings than your calendar shows</td><td>Normal attribution gap</td><td>Trust the calendar. That's why the UTMs are there</td></tr>\n    <tr><td>Lots of unqualified bookings</td><td>No budget question, or the range is too low</td><td>Add it, or raise the stated range</td></tr>\n  </table>\n\n  <h3>When to scale</h3>\n  <p>All three must be true:</p>\n  <ol class=\"tight\">\n    <li>Cost per booked call is under your ceiling from Section 2</li>\n    <li>At least 20 booked calls of data</li>\n    <li>Show rate above 60%</li>\n  </ol>\n  <div class=\"script\">\n    <div class=\"lbl\">How to scale</div>\n    <p>Raise the daily budget <strong>20&ndash;30%</strong>, then wait <strong>4 days</strong>. If cost per call holds, raise again.</p>\n    <p>Doubling the budget overnight resets learning and usual
